<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="container">
        <header>
            <h1>Personal Finance Advisor</h1>
            <p>Get AI-powered insights into your monthly finances.</p>
        </header>

        <main>
            <section class="card">
                <h2>Enter Your Financial Details</h2>

                <form id="financeForm">
                    <div class="form-group">
                        <label for="income">Monthly Income (₹)</label>
                        <input type="number" id="income" name="income" min="0" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="expenses">Monthly Expenses (₹)</label>
                        <input type="number" id="expenses" name="expenses" min="0" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="savings_goal">Monthly Savings Goal (₹)</label>
                        <input type="number" id="savings_goal" name="savings_goal" min="0" step="0.01" required>
                    </div>

                    <button type="submit" id="analyseBtn">Analyse My Finances</button>
                </form>
            </section>

            <section class="card result-card" id="resultSection" style="display: none;">
                <h2>Your Financial Analysis</h2>
                <div id="loading" style="display: none;">
                    <p>Analysing your finances...</p>
                </div>

                <div id="result"></div>
            </section>
        </main>

        <footer>
            <p>Personal Finance Advisor Bot</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
